name: Daily PRISM and ET Sync

on:
  schedule:
    - cron: '0 7 * * *' 
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2

      - name: Set up Python Environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install Geospatial Libraries
        run: |
          pip install rasterio pandas numpy requests

      - name: Run Climate Calculation Engine
        run: |
          python your_prism_script.py

      # 🟢 NEW: Instantly emails the updated Excel-ready spreadsheet file to your team
      - name: Send Automated Daily Email to Team
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ://gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📊 New Daily Climate Update: ETo & Heat Units"
          to: "PASTE_YOUR_TEAM_EMAILS_HERE_SEPARATED_BY_COMMAS"
          from: "Climate Automation Bot"
          body: "Hello Team,\n\nPlease find attached yesterday's processed PRISM weather metrics, Penman-Monteith crop ETo depth calculations, and 85/50 agronomical Heat Unit totals.\n\nBest regards,\nYour Automated Crop Bot"
          attachments: "CLEAN_ET_HU_DATA.csv"
